version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      lint-tooling:
        patterns: ["eslint", "@eslint/js", "typescript-eslint", "eslint-config-next"]
        update-types: ["minor", "patch"]
    ignore:
      # React lint plugins currently support ESLint 9, not ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Upgrade this together with the Next.js framework, not independently.
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # Type definitions must describe the deployed Node 22 runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
